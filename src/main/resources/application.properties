spring.application.name=cards-service
server.port=8090

# --- Datasource ---------------------------------------------------------------
# Spring Boot Docker Compose auto-starts compose.yaml and wires these in dev,
# but setting them explicitly keeps the app runnable against any MySQL too.
spring.datasource.url=jdbc:mysql://localhost:3306/cards?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=card
spring.datasource.password=admin
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


# --- JPA / Hibernate ----------------------------------------------------------
# Schema + data are owned by db/init/*.sql (run by the MySQL container).
# Keep Hibernate read-only on DDL so it never drops/recreates the seeded tables.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# --- OpenAPI / Swagger ----------------------------------------------------------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

spring.threads.virtual.enabled=true
spring.datasource.hikari.maximum-pool-size=200
server.tomcat.threads.max=20